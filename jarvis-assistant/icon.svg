<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#050a12"/>
  <!-- матричная подложка -->
  <g stroke="#0a2a3a" stroke-width="4" opacity="0.7">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <!-- реактор -->
  <g fill="none" stroke="#00e5ff">
    <circle cx="256" cy="256" r="150" stroke-width="16" opacity="0.95"/>
    <circle cx="256" cy="256" r="112" stroke-width="10" opacity="0.5" stroke-dasharray="44 26"/>
    <circle cx="256" cy="256" r="66" stroke-width="18" opacity="0.9"/>
  </g>
  <!-- треугольник-ядро -->
  <path d="M256 156 L344 310 H168 Z" fill="none" stroke="#7df9ff" stroke-width="14" stroke-linejoin="round" opacity="0.85"/>
  <!-- центральное свечение -->
  <circle cx="256" cy="256" r="28" fill="#7df9ff"/>
  <circle cx="256" cy="256" r="28" fill="none" stroke="#eaffff" stroke-width="6"/>
</svg>
