<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Windows Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cyan: #00e5ff;
    --blue: #0088ff;
    --dim: rgba(0, 229, 255, 0.35);
    --panel: rgba(0, 24, 48, 0.42);
    --panel-border: rgba(0, 229, 255, 0.28);
    --text: #cfefff;
  }

  html, body {
    height: 100%;
    background: radial-gradient(ellipse at 50% 0%, #04122b 0%, #01060f 60%, #000308 100%);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ===== КИБЕР-ДОЖДЬ ===== */
  #rain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  /* ===== ОБЩЕЕ ===== */
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 0 18px rgba(0, 150, 255, 0.12),
      inset 0 0 24px rgba(0, 180, 255, 0.06);
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 60px; height: 3px;
    background: linear-gradient(90deg, var(--cyan), transparent);
  }
  .panel-title {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
    padding: 12px 16px 8px;
    border-bottom: 1px solid rgba(0, 229, 255, 0.15);
  }

  /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 22px;
    background: rgba(0, 18, 38, 0.55);
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 2px 24px rgba(0, 150, 255, 0.15);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-size: clamp(14px, 2.4vw, 20px);
    font-weight: 600;
    letter-spacing: 4px;
    color: #eaffff;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logo span { color: var(--cyan); }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7dffcb;
    border: 1px solid rgba(0, 255, 170, 0.35);
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(0, 60, 45, 0.3);
    white-space: nowrap;
  }
  .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff9d;
    box-shadow: 0 0 10px #00ff9d;
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ===== СЕТКА ===== */
  main {
    display: grid;
    grid-template-columns: 300px 1fr 380px;
    gap: 16px;
    padding: 18px;
    max-width: 1500px;
    margin: 0 auto;
    align-items: stretch;
  }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  /* ===== СТАТИСТИКА ===== */
  .stat { padding: 14px 16px; }
  .stat-head {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: #a9e9ff;
  }
  .stat-val {
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.7);
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 8px;
    background: rgba(0, 60, 100, 0.35);
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.9);
    transition: width 0.9s ease;
  }

  /* ===== ЯДРО ===== */
  .core-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    min-height: 380px;
  }
  .core {
    position: relative;
    width: min(300px, 70vw);
    height: min(300px, 70vw);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(0, 200, 255, 0.55)); }
    50%      { transform: scale(1.06); filter: drop-shadow(0 0 45px rgba(0, 220, 255, 0.95)); }
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0, 229, 255, 0.55);
  }
  .ring.r1 {
    inset: 0;
    border-top-color: transparent;
    border-bottom-color: transparent;
    box-shadow: 0 0 22px rgba(0, 200, 255, 0.35) inset;
    animation: spin 9s linear infinite;
  }
  .ring.r2 {
    inset: 14%;
    border-left-color: transparent;
    border-right-color: transparent;
    animation: spin 6s linear infinite reverse;
  }
  .ring.r3 {
    inset: 28%;
    border-style: dashed;
    opacity: 0.7;
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core-inner {
    width: 38%;
    height: 38%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #bdf6ff, #00c2ff 45%, #004b8f 100%);
    box-shadow:
      0 0 30px rgba(0, 229, 255, 0.9),
      0 0 70px rgba(0, 140, 255, 0.6),
      inset 0 0 18px rgba(255, 255, 255, 0.5);
    animation: heartbeat 2.4s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }
  .core-label {
    margin-top: 26px;
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
    text-align: center;
  }

  /* ===== БЫСТРЫЕ КОМАНДЫ ===== */
  .quick { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; }
  .qbtn {
    font: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--text);
    background: rgba(0, 90, 160, 0.18);
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 6px;
    padding: 11px 14px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
  }
  .qbtn:hover {
    background: rgba(0, 170, 255, 0.28);
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.45);
    transform: translateX(4px);
    color: #fff;
  }
  .qbtn:active { transform: translateX(4px) scale(0.98); }

  /* ===== ЧАТ ===== */
  .chat { display: flex; flex-direction: column; flex: 1; min-height: 320px; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 55vh;
    min-height: 220px;
  }
  .msg {
    max-width: 85%;
    padding: 9px 13px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    animation: fadeIn 0.3s ease;
    word-wrap: break-word;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: rgba(0, 120, 255, 0.22);
    border: 1px solid rgba(0, 150, 255, 0.5);
    box-shadow: 0 0 10px rgba(0, 140, 255, 0.25);
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(0, 60, 70, 0.35);
    border: 1px solid rgba(0, 229, 255, 0.45);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
  }
  .msg .who {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 3px;
  }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid rgba(0, 229, 255, 0.18);
  }
  .chat-input input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    color: #eaffff;
    background: rgba(0, 30, 60, 0.55);
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 6px;
    padding: 11px 13px;
    outline: none;
    transition: box-shadow 0.2s;
  }
  .chat-input input::placeholder { color: rgba(160, 220, 255, 0.45); }
  .chat-input input:focus { box-shadow: 0 0 14px rgba(0, 229, 255, 0.4); }
  .chat-input button {
    font: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    color: #00131f;
    font-weight: 600;
    background: linear-gradient(180deg, #4df3ff, #00b4e6);
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
    transition: all 0.2s;
  }
  .chat-input button:hover { box-shadow: 0 0 24px rgba(0, 229, 255, 0.85); filter: brightness(1.1); }
  .chat-input button:active { transform: scale(0.96); }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.35); border-radius: 3px; }

  footer {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(140, 210, 255, 0.4);
    padding: 8px 0 18px;
  }

  /* ===== АДАПТИВНОСТЬ ===== */
  @media (max-width: 1050px) {
    main { grid-template-columns: 1fr 1fr; }
    .col-center { grid-column: 1 / -1; order: -1; }
  }
  @media (max-width: 680px) {
    main { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
    .col-center { order: -1; }
    header { padding: 12px 14px; }
    .logo { letter-spacing: 2px; }
    .status { padding: 5px 10px; letter-spacing: 1px; }
    #messages { max-height: 45vh; }
    .core-wrap { min-height: 300px; padding: 22px 10px; }
    .chat-input button { padding: 0 14px; }
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>

<header>
  <div class="logo">J.A.R.V.I.S. <span>— Windows Assistant</span></div>
  <div class="status"><span class="dot"></span> Online</div>
</header>

<main>
  <!-- ЛЕВАЯ КОЛОНКА -->
  <div class="col">
    <section class="panel">
      <div class="panel-title">System Status</div>
      <div class="stat">
        <div class="stat-head"><span>CPU</span><span class="stat-val" id="cpuVal">0%</span></div>
        <div class="bar"><div class="bar-fill" id="cpuBar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>RAM</span><span class="stat-val" id="ramVal">0%</span></div>
        <div class="bar"><div class="bar-fill" id="ramBar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-head"><span>Network</span><span class="stat-val" id="netVal">0 Mb/s</span></div>
        <div class="bar"><div class="bar-fill" id="netBar"></div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Quick Commands</div>
      <div class="quick">
        <button class="qbtn" data-cmd="Открыть браузер">◈ Открыть браузер</button>
        <button class="qbtn" data-cmd="Запустить игру">◈ Запустить игру</button>
        <button class="qbtn" data-cmd="Скриншот">◈ Скриншот</button>
      </div>
    </section>
  </div>

  <!-- ЦЕНТР: ЯДРО -->
  <div class="col col-center">
    <section class="panel core-wrap">
      <div class="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core-inner"></div>
      </div>
      <div class="core-label">Core Reactor — Active</div>
    </section>
  </div>

  <!-- ПРАВАЯ КОЛОНКА: ЧАТ -->
  <div class="col">
    <section class="panel chat">
      <div class="panel-title">Communication Channel</div>
      <div id="messages">
        <div class="msg bot"><span class="who">J.A.R.V.I.S.</span>Все системы работают в штатном режиме. Слушаю вас.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="msgInput" placeholder="Введите команду..." autocomplete="off">
        <button id="sendBtn">Отправить</button>
      </div>
    </section>
  </div>
</main>

<footer>J.A.R.V.I.S. INTERFACE v2.6 // ALL SYSTEMS NOMINAL</footer>

<script>
/* ===== КИБЕР-ДОЖДЬ ===== */
(function () {
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var drops = [];
  var W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    var count = Math.floor(W / 12);
    drops = [];
    for (var i = 0; i < count; i++) drops.push(makeDrop(true));
  }

  function makeDrop(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -Math.random() * 200 - 20,
      len: 40 + Math.random() * 90,
      speed: 3 + Math.random() * 7,
      alpha: 0.25 + Math.random() * 0.6,
      width: Math.random() < 0.25 ? 2 : 1
    };
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var grad = ctx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
      grad.addColorStop(0, 'rgba(0, 229, 255, 0)');
      grad.addColorStop(1, 'rgba(0, 229, 255, ' + d.alpha + ')');
      ctx.strokeStyle = grad;
      ctx.lineWidth = d.width;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y - d.len);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();

      ctx.fillStyle = 'rgba(190, 250, 255, ' + Math.min(1, d.alpha + 0.3) + ')';
      ctx.fillRect(d.x - d.width / 2, d.y - 2, d.width, 3);

      d.y += d.speed;
      if (d.y - d.len > H) drops[i] = makeDrop(false);
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

/* ===== СТАТИСТИКА (каждые 2 секунды) ===== */
(function () {
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function update() {
    var cpu = rand(8, 92);
    var ram = rand(25, 85);
    var net = rand(1, 950);

    document.getElementById('cpuVal').textContent = cpu + '%';
    document.getElementById('cpuBar').style.width = cpu + '%';
    document.getElementById('ramVal').textContent = ram + '%';
    document.getElementById('ramBar').style.width = ram + '%';
    document.getElementById('netVal').textContent = net + ' Mb/s';
    document.getElementById('netBar').style.width = Math.min(100, Math.round(net / 10)) + '%';
  }

  update();
  setInterval(update, 2000);
})();

/* ===== ЧАТ ===== */
(function () {
  var messages = document.getElementById('messages');
  var input = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');

  function addMsg(text, who) {
    var el = document.createElement('div');
    el.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
    var label = document.createElement('span');
    label.className = 'who';
    label.textContent = who === 'user' ? 'Вы' : 'J.A.R.V.I.S.';
    el.appendChild(label);
    el.appendChild(document.createTextNode(text));
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function send(text) {
    text = (text || '').trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    setTimeout(function () {
      addMsg('Команда принята. Выполняю анализ.', 'bot');
    }, 600);
  }

  sendBtn.addEventListener('click', function () { send(input.value); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') send(input.value);
  });

  document.querySelectorAll('.qbtn').forEach(function (btn) {
    btn.addEventListener('click', function () { send(btn.getAttribute('data-cmd')); });
  });
})();
</script>
</body>
</html>
